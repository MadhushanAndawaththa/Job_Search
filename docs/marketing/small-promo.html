<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Small Promo 440×280</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 440px;
      height: 280px;
      overflow: hidden;
      font-family: "Aptos", "Segoe UI", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      position: relative;
      display: grid;
      grid-template-columns: 1.03fr .97fr;
      gap: 18px;
      padding: 25px 24px 23px 27px;
      color: #fff;
      background: #07142d;
    }
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(21,94,239,.20), transparent 46%),
        repeating-linear-gradient(0deg, transparent 0 34px, rgba(255,255,255,.035) 34px 35px);
      pointer-events: none;
    }
    .copy, .queue { position: relative; z-index: 1; }
    .copy { display: flex; flex-direction: column; }
    .brand { display: flex; align-items: center; gap: 9px; }
    .icon {
      width: 31px; height: 31px; border-radius: 8px;
      display: grid; place-items: center;
      color: #ffd21a; background: #0d2044;
      border: 1px solid rgba(255,255,255,.13);
    }
    .icon svg { width: 17px; height: 17px; }
    .name { font-size: 13px; font-weight: 750; letter-spacing: -.02em; }
    h1 {
      margin-top: 30px;
      font-family: "Arial Black", "Aptos Display", "Segoe UI", sans-serif;
      font-size: 27px;
      line-height: 1.04;
      letter-spacing: -.045em;
    }
    h1 span {
      display: inline-block;
      margin-top: 8px;
      line-height: 1.02;
      padding: 1px 5px 3px;
      border-radius: 3px;
      color: #07142d;
      background: #ffd21a;
    }
    .meta {
      margin-top: auto;
      color: #9da9c5;
      font-family: "Cascadia Mono", Consolas, monospace;
      font-size: 8.5px;
      font-weight: 700;
      letter-spacing: .055em;
      text-transform: uppercase;
    }
    .queue {
      align-self: center;
      height: 217px;
      padding: 13px 11px 12px 31px;
      border-radius: 15px;
      background: #edf3fb;
      box-shadow: 0 22px 42px rgba(0,0,0,.34);
      transform: rotate(2deg);
      color: #08142f;
    }
    .rail {
      position: absolute; inset: 0 auto 0 0; width: 23px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 15px 0 0 15px;
      background: #0c1d3e;
      color: #ffd21a;
      font-family: "Cascadia Mono", Consolas, monospace;
      font-size: 7px; font-weight: 800; letter-spacing: .16em;
      text-transform: uppercase; writing-mode: vertical-rl;
      transform: rotate(180deg);
    }
    .queue-label {
      margin-bottom: 9px;
      color: #63708c;
      font-family: "Cascadia Mono", Consolas, monospace;
      font-size: 7px; font-weight: 800; letter-spacing: .06em;
      text-transform: uppercase;
    }
    .job {
      position: relative;
      padding: 10px 8px 9px 12px;
      border-radius: 7px;
      background: #fff;
      box-shadow: 0 1px 0 rgba(8,20,47,.08);
    }
    .job + .job { margin-top: 7px; }
    .job.new { box-shadow: inset 3px 0 #ffd21a, 0 1px 0 rgba(8,20,47,.08); }
    .job.dim { opacity: .40; filter: grayscale(.45); }
    .title { font-size: 8.5px; font-weight: 750; }
    .company { margin-top: 2px; color: #76819a; font-size: 7px; }
    .state {
      display: inline-block; margin-top: 5px; padding: 2px 5px;
      border-radius: 3px; background: #ffd21a;
      font-family: "Cascadia Mono", Consolas, monospace;
      font-size: 5.5px; font-weight: 800; text-transform: uppercase;
    }
    .state.muted { color: #526078; background: #e6ebf2; }
  </style>
</head>
<body>
  <section class="copy">
    <div class="brand">
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </span>
      <span class="name">Job Search Lens</span>
    </div>
    <h1>See what's new.<br><span>Fade what isn't.</span></h1>
    <p class="meta">LinkedIn review queue · local-only</p>
  </section>

  <section class="queue">
    <span class="rail">Lens / review</span>
    <p class="queue-label">3 visible jobs</p>
    <div class="job new">
      <div class="title">Senior Python Engineer</div>
      <div class="company">Pinion · Remote</div>
      <span class="state">New match</span>
    </div>
    <div class="job dim">
      <div class="title">Lead Platform Engineer</div>
      <div class="company">Acme Studio</div>
      <span class="state muted">Viewed</span>
    </div>
    <div class="job dim">
      <div class="title">Staff Backend Engineer</div>
      <div class="company">Northwind Labs</div>
      <span class="state muted">Saved</span>
    </div>
  </section>
</body>
</html>
