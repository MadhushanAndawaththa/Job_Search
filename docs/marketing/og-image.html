<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OG Image 1200×630</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      font-family: "Aptos", "Segoe UI", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      position: relative;
      display: grid;
      grid-template-columns: 690px 510px;
      color: #fff;
      background: #07142d;
    }
    body::before {
      content: '';
      position: absolute; inset: 0 510px 0 0;
      background:
        linear-gradient(90deg, rgba(21,94,239,.24), transparent 62%),
        repeating-linear-gradient(0deg, transparent 0 55px, rgba(255,255,255,.035) 55px 56px);
      pointer-events: none;
    }
    .left {
      position: relative;
      z-index: 1;
      padding: 58px 54px 48px 66px;
      display: flex;
      flex-direction: column;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .icon {
      width: 42px; height: 42px; border-radius: 11px;
      display: grid; place-items: center;
      border: 1px solid rgba(255,255,255,.14);
      background: #0d2044; color: #ffd21a;
    }
    .icon svg { width: 23px; height: 23px; }
    .brand-name { font-size: 17px; font-weight: 800; letter-spacing: -.02em; }
    .eyebrow {
      margin-top: 54px;
      color: #9eabc8;
      font-family: "Cascadia Mono", Consolas, monospace;
      font-size: 10px; font-weight: 800; letter-spacing: .12em;
      text-transform: uppercase;
    }
    h1 {
      margin-top: 17px;
      font-family: "Arial Black", "Aptos Display", "Segoe UI", sans-serif;
      font-size: 58px; font-weight: 900; line-height: 1.04; letter-spacing: -.052em;
    }
    h1 span {
      display: inline-block;
      margin-top: 11px; padding: 1px 8px 5px; line-height: 1.02;
      border-radius: 5px; background: #ffd21a; color: #07142d;
    }
    .sub {
      max-width: 570px; margin-top: 22px;
      color: #bdc7df; font-size: 17px; line-height: 1.5;
    }
    .route {
      margin-top: auto;
      color: #9eabc8;
      font-family: "Cascadia Mono", Consolas, monospace;
      font-size: 10px; font-weight: 750; letter-spacing: .03em;
    }
    .route span { color: #ffd21a; padding: 0 7px; }

    .right {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: linear-gradient(145deg, #f4f7fb, #dce7f5 72%, #fff1ac);
    }
    .right::before {
      content: 'PRODUCTION POPUP';
      position: absolute; top: 29px; right: 31px;
      color: #748099;
      font-family: "Cascadia Mono", Consolas, monospace;
      font-size: 9px; font-weight: 800; letter-spacing: .11em;
    }
    .rail {
      position: absolute; inset: 0 auto 0 0; width: 44px;
      display: flex; align-items: center; justify-content: center;
      background: #0d2044; color: #ffd21a;
      font-family: "Cascadia Mono", Consolas, monospace;
      font-size: 8px; font-weight: 800; letter-spacing: .14em;
      text-transform: uppercase; writing-mode: vertical-rl; transform: rotate(180deg);
    }
    .device {
      width: 286px;
      padding: 13px;
      border: 1px solid rgba(8,20,47,.12);
      border-radius: 24px;
      background: rgba(255,255,255,.78);
      box-shadow: 0 34px 70px -20px rgba(7,20,45,.36);
      transform: rotate(1.5deg);
    }
    .popup-clip {
      width: 260px;
      height: 452px;
      overflow: hidden;
      border: 1px solid #dce3ed;
      border-radius: 14px;
      background: #fff;
    }
    .popup-img {
      display: block;
      width: 260px;
      height: 452px;
      object-fit: cover;
      object-position: top center;
    }
  </style>
</head>
<body>
  <section class="left">
    <div class="brand">
      <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span>
      <span class="brand-name">Job Search Lens</span>
    </div>
    <p class="eyebrow">A quieter LinkedIn job search</p>
    <h1>See what's new.<br><span>Fade what isn't.</span></h1>
    <p class="sub">A local-only review queue for processed jobs, company context, and the terms that matter to you.</p>
    <p class="route">Visible page text <span>→</span> current tab <span>→</span> nowhere else</p>
  </section>
  <section class="right">
    <span class="rail">Lens / production view</span>
    <div class="device"><div class="popup-clip"><img class="popup-img" src="../assets/store/popup-dark-preview.png" alt="Job Search Lens popup"></div></div>
  </section>
</body>
</html>
